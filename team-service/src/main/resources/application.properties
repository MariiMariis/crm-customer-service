spring.application.name=team-service
server.port=8082
server.shutdown=graceful

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.request-connect-timeout=1500
spring.cloud.config.request-read-timeout=3000

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/team_db}
spring.datasource.username=${DB_USERNAME:team}
spring.datasource.password=${DB_PASSWORD:team}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:crm}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:crm}
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=4
spring.rabbitmq.listener.simple.prefetch=10

crm.messaging.exchange=team.events
crm.messaging.outbox.poll-interval=500ms
crm.messaging.outbox.batch-size=50
crm.messaging.retry.delays=5s,30s,2m

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.revision_field_name=rev
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=revtype
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
info.app.name=${spring.application.name}
info.app.description=Equipe comercial do CRM
info.app.version=0.4.0

platform.config-source=local-file
