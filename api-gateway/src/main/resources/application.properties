spring.application.name=api-gateway
server.port=8080
server.shutdown=graceful

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.request-connect-timeout=1500
spring.cloud.config.request-read-timeout=3000

crm.gateway.services.team-service=${TEAM_SERVICE_URL:http://localhost:8082}
crm.gateway.services.accounts-service=${ACCOUNTS_SERVICE_URL:http://localhost:8083}
crm.gateway.services.catalog-service=${CATALOG_SERVICE_URL:http://localhost:8084}
crm.gateway.services.sales-service=${SALES_SERVICE_URL:http://localhost:8085}
crm.gateway.services.notification-service=${NOTIFICATION_SERVICE_URL:http://localhost:8081}
crm.gateway.config-server-url=${CONFIG_SERVER_URL:http://localhost:8888}
crm.gateway.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}
crm.gateway.health-timeout=2s
crm.gateway.circuit-breaker.timeout=10s
crm.gateway.circuit-breaker.failure-rate-threshold=50
crm.gateway.circuit-breaker.sliding-window-size=10
crm.gateway.circuit-breaker.minimum-number-of-calls=5
crm.gateway.circuit-breaker.wait-duration-in-open-state=15s

spring.cloud.gateway.server.webmvc.routes[0].id=team-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${crm.gateway.services.team-service}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/sales-reps/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.id=team-service
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.fallbackUri=forward:/fallback/team-service

spring.cloud.gateway.server.webmvc.routes[1].id=accounts-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${crm.gateway.services.accounts-service}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/companies/**,/api/contacts/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.id=accounts-service
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.fallbackUri=forward:/fallback/accounts-service

spring.cloud.gateway.server.webmvc.routes[2].id=catalog-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${crm.gateway.services.catalog-service}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/products/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[2].filters[0].args.id=catalog-service
spring.cloud.gateway.server.webmvc.routes[2].filters[0].args.fallbackUri=forward:/fallback/catalog-service

spring.cloud.gateway.server.webmvc.routes[3].id=sales-service
spring.cloud.gateway.server.webmvc.routes[3].uri=${crm.gateway.services.sales-service}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/leads/**,/api/opportunities/**,/api/activities/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[3].filters[0].args.id=sales-service
spring.cloud.gateway.server.webmvc.routes[3].filters[0].args.fallbackUri=forward:/fallback/sales-service

spring.cloud.gateway.server.webmvc.routes[4].id=notification-service
spring.cloud.gateway.server.webmvc.routes[4].uri=${crm.gateway.services.notification-service}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/notifications/**,/api/notification-preferences/**
spring.cloud.gateway.server.webmvc.routes[4].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[4].filters[0].args.id=notification-service
spring.cloud.gateway.server.webmvc.routes[4].filters[0].args.fallbackUri=forward:/fallback/notification-service

spring.cloud.gateway.server.webmvc.routes[5].id=team-service-messaging
spring.cloud.gateway.server.webmvc.routes[5].uri=${crm.gateway.services.team-service}
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/platform/team/messaging/**
spring.cloud.gateway.server.webmvc.routes[5].filters[0]=RewritePath=/api/platform/team/messaging/(?<segment>.*), /api/messaging/$\{segment}
spring.cloud.gateway.server.webmvc.routes[5].filters[1].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[5].filters[1].args.id=team-service
spring.cloud.gateway.server.webmvc.routes[5].filters[1].args.fallbackUri=forward:/fallback/team-service

spring.cloud.gateway.server.webmvc.routes[6].id=accounts-service-messaging
spring.cloud.gateway.server.webmvc.routes[6].uri=${crm.gateway.services.accounts-service}
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/platform/accounts/messaging/**
spring.cloud.gateway.server.webmvc.routes[6].filters[0]=RewritePath=/api/platform/accounts/messaging/(?<segment>.*), /api/messaging/$\{segment}
spring.cloud.gateway.server.webmvc.routes[6].filters[1].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[6].filters[1].args.id=accounts-service
spring.cloud.gateway.server.webmvc.routes[6].filters[1].args.fallbackUri=forward:/fallback/accounts-service

spring.cloud.gateway.server.webmvc.routes[7].id=catalog-service-messaging
spring.cloud.gateway.server.webmvc.routes[7].uri=${crm.gateway.services.catalog-service}
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/api/platform/catalog/messaging/**
spring.cloud.gateway.server.webmvc.routes[7].filters[0]=RewritePath=/api/platform/catalog/messaging/(?<segment>.*), /api/messaging/$\{segment}
spring.cloud.gateway.server.webmvc.routes[7].filters[1].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[7].filters[1].args.id=catalog-service
spring.cloud.gateway.server.webmvc.routes[7].filters[1].args.fallbackUri=forward:/fallback/catalog-service

spring.cloud.gateway.server.webmvc.routes[8].id=sales-service-messaging
spring.cloud.gateway.server.webmvc.routes[8].uri=${crm.gateway.services.sales-service}
spring.cloud.gateway.server.webmvc.routes[8].predicates[0]=Path=/api/platform/sales/messaging/**
spring.cloud.gateway.server.webmvc.routes[8].filters[0]=RewritePath=/api/platform/sales/messaging/(?<segment>.*), /api/messaging/$\{segment}
spring.cloud.gateway.server.webmvc.routes[8].filters[1].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[8].filters[1].args.id=sales-service
spring.cloud.gateway.server.webmvc.routes[8].filters[1].args.fallbackUri=forward:/fallback/sales-service

spring.cloud.gateway.server.webmvc.routes[9].id=notification-service-messaging
spring.cloud.gateway.server.webmvc.routes[9].uri=${crm.gateway.services.notification-service}
spring.cloud.gateway.server.webmvc.routes[9].predicates[0]=Path=/api/platform/notification/messaging/**
spring.cloud.gateway.server.webmvc.routes[9].filters[0]=RewritePath=/api/platform/notification/messaging/(?<segment>.*), /api/messaging/$\{segment}
spring.cloud.gateway.server.webmvc.routes[9].filters[1].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[9].filters[1].args.id=notification-service
spring.cloud.gateway.server.webmvc.routes[9].filters[1].args.fallbackUri=forward:/fallback/notification-service

management.endpoints.web.exposure.include=health,info,gateway,circuitbreakers
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
info.app.name=${spring.application.name}
info.app.description=API Gateway do CRM
info.app.version=0.4.0

platform.config-source=local-file

logging.pattern.correlation=[%X{trace_id:-},%X{span_id:-}] 
