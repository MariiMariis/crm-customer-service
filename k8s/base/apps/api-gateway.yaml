apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/component: backend
    spec:
      terminationGracePeriodSeconds: 45
      initContainers:
        - name: wait-dependencies
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z config-server 8888; do echo aguardando dependencias; sleep 3; done"]
      containers:
        - name: api-gateway
          image: mariimariis/crm-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=nexo-crm,k8s.namespace.name=crm,k8s.pod.name=$(POD_NAME)
            - name: TEAM_SERVICE_URL
              value: http://team-service:8082
            - name: ACCOUNTS_SERVICE_URL
              value: http://accounts-service:8083
            - name: CATALOG_SERVICE_URL
              value: http://catalog-service:8084
            - name: SALES_SERVICE_URL
              value: http://sales-service:8085
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification-service:8081
            - name: ALLOWED_ORIGINS
              value: http://crm.localhost
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
