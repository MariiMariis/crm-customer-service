apiVersion: v1
kind: Service
metadata:
  name: accounts-service
  labels:
    app.kubernetes.io/name: accounts-service
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: accounts-service
  ports:
    - name: http
      port: 8083
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts-service
  labels:
    app.kubernetes.io/name: accounts-service
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: accounts-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: accounts-service
        app.kubernetes.io/component: backend
    spec:
      terminationGracePeriodSeconds: 45
      initContainers:
        - name: wait-dependencies
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z postgres-accounts 5432 && nc -z rabbitmq 5672 && nc -z config-server 8888; do echo aguardando dependencias; sleep 3; done"]
      containers:
        - name: accounts-service
          image: mariimariis/crm-accounts-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres-accounts:5432/accounts_db
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: accounts-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: accounts-db-credentials
                  key: password
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
