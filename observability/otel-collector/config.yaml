receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch:
    send_batch_size: 1024
    timeout: 2s
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    policies:
      - name: descarta-health-checks
        type: drop
        drop:
          drop_sub_policy:
            - name: rotas-actuator
              type: ottl_condition
              ottl_condition:
                error_mode: ignore
                span:
                  - 'IsMatch(attributes["url.path"], "^/actuator.*")'
                  - 'IsMatch(attributes["http.route"], "^/actuator.*")'
      - name: descarta-queries-sem-origem
        type: drop
        drop:
          drop_sub_policy:
            - name: raiz-de-banco
              type: ottl_condition
              ottl_condition:
                error_mode: ignore
                span:
                  - 'IsRootSpan() and (attributes["db.system"] != nil or attributes["db.system.name"] != nil)'
      - name: descarta-topologia-rabbitmq
        type: drop
        drop:
          drop_sub_policy:
            - name: declaracoes-amqp
              type: ottl_condition
              ottl_condition:
                error_mode: ignore
                span:
                  - 'IsRootSpan() and IsMatch(name, "^(queue|exchange|confirm|basic\\.qos|basic\\.consume)")'
      - name: mantem-o-restante
        type: always_sample
  resource/environment:
    attributes:
      - key: deployment.environment.name
        value: ${env:DEPLOYMENT_ENVIRONMENT}
        action: upsert

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, resource/environment, batch]
      exporters: [otlp_grpc/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/environment, batch]
      exporters: [otlp_http/loki]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/environment, batch]
      exporters: [otlp_http/prometheus]
