name: CD

on:
  push:
    branches: [master, TP5]
    tags-ignore: ["**"]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  REGISTRY_NAMESPACE: mariimariis

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  version:
    name: Versao da entrega
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publica ${{ matrix.image }}
    needs: [ci, version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: config-server
            dockerfile: config-server/Dockerfile
            context: .
          - image: team-service
            dockerfile: team-service/Dockerfile
            context: .
          - image: accounts-service
            dockerfile: accounts-service/Dockerfile
            context: .
          - image: catalog-service
            dockerfile: catalog-service/Dockerfile
            context: .
          - image: sales-service
            dockerfile: sales-service/Dockerfile
            context: .
          - image: notification-service
            dockerfile: notification-service/Dockerfile
            context: .
          - image: api-gateway
            dockerfile: api-gateway/Dockerfile
            context: .
          - image: seeder
            dockerfile: crm-seeder/Dockerfile
            context: .
          - image: frontend
            dockerfile: frontend/Dockerfile
            context: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY_NAMESPACE }}/crm-${{ matrix.image }}:${{ needs.version.outputs.tag }}
            ${{ env.REGISTRY_NAMESPACE }}/crm-${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy no Kubernetes (kind)
    needs: [publish, version]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: producao-simulada
      url: http://crm.localhost
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Instala o kind
        uses: helm/kind-action@v1.15.0
        with:
          install_only: true

      - name: Cria o cluster com Ingress NGINX e metrics-server
        run: ./k8s/scripts/cluster-up.sh

      - name: Fixa as imagens publicadas neste commit
        working-directory: k8s/overlays/prod
        run: |
          for image in config-server team-service accounts-service catalog-service sales-service notification-service api-gateway frontend seeder; do
            kustomize edit set image "${REGISTRY_NAMESPACE}/crm-${image}=${REGISTRY_NAMESPACE}/crm-${image}:${TAG}"
          done
          grep -A1 "name: ${REGISTRY_NAMESPACE}" kustomization.yaml

      - name: Deploy da observabilidade e da plataforma
        run: ./k8s/scripts/deploy.sh prod

      - name: Smoke test
        run: ./k8s/scripts/smoke-test.sh

      - name: Resumo do deploy
        if: always()
        run: |
          {
            echo "## Deploy ${TAG}"
            echo
            echo "### Pods"
            echo '```'
            kubectl -n crm get pods -o wide || true
            echo '```'
            echo "### Autoscaling"
            echo '```'
            kubectl -n crm get hpa || true
            echo '```'
            echo "### Observabilidade"
            echo '```'
            kubectl -n observability get pods || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostico em caso de falha
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n crm get events --sort-by=.lastTimestamp | tail -50 || true
          for deployment in config-server team-service accounts-service catalog-service sales-service notification-service api-gateway frontend; do
            echo "::group::logs $deployment"
            kubectl -n crm logs "deployment/$deployment" --all-containers --tail=100 || true
            echo "::endgroup::"
          done
