name: pb-crm

include:
  - docker-compose.yml

x-java-service: &java-service
  restart: unless-stopped
  depends_on: &java-depends
    rabbitmq:
      condition: service_healthy
    config-server:
      condition: service_healthy

x-java-env: &java-env
  CONFIG_SERVER_URL: http://config-server:8888
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: ${RABBITMQ_USER:-crm}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-crm}
  PLATFORM_ENVIRONMENT: docker

services:
  config-server:
    image: ${REGISTRY:-mariimariis}/crm-config-server:${TAG:-latest}
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: pb-crm-config-server
    restart: unless-stopped

  team-service:
    <<: *java-service
    image: ${REGISTRY:-mariimariis}/crm-team-service:${TAG:-latest}
    build:
      context: .
      dockerfile: team-service/Dockerfile
    container_name: pb-crm-team-service
    depends_on:
      <<: *java-depends
      postgres-team:
        condition: service_healthy
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres-team:5432/team_db
      DB_USERNAME: ${TEAM_DB_USER:-team}
      DB_PASSWORD: ${TEAM_DB_PASSWORD:-team}

  accounts-service:
    <<: *java-service
    image: ${REGISTRY:-mariimariis}/crm-accounts-service:${TAG:-latest}
    build:
      context: .
      dockerfile: accounts-service/Dockerfile
    container_name: pb-crm-accounts-service
    depends_on:
      <<: *java-depends
      postgres-accounts:
        condition: service_healthy
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres-accounts:5432/accounts_db
      DB_USERNAME: ${ACCOUNTS_DB_USER:-accounts}
      DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD:-accounts}

  catalog-service:
    <<: *java-service
    image: ${REGISTRY:-mariimariis}/crm-catalog-service:${TAG:-latest}
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    container_name: pb-crm-catalog-service
    depends_on:
      <<: *java-depends
      postgres-catalog:
        condition: service_healthy
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres-catalog:5432/catalog_db
      DB_USERNAME: ${CATALOG_DB_USER:-catalog}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog}

  sales-service:
    <<: *java-service
    image: ${REGISTRY:-mariimariis}/crm-sales-service:${TAG:-latest}
    build:
      context: .
      dockerfile: sales-service/Dockerfile
    container_name: pb-crm-sales-service
    depends_on:
      <<: *java-depends
      postgres-sales:
        condition: service_healthy
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres-sales:5432/sales_db
      DB_USERNAME: ${SALES_DB_USER:-sales}
      DB_PASSWORD: ${SALES_DB_PASSWORD:-sales}

  notification-service:
    <<: *java-service
    image: ${REGISTRY:-mariimariis}/crm-notification-service:${TAG:-latest}
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: pb-crm-notification-service
    depends_on:
      <<: *java-depends
      postgres-notification:
        condition: service_healthy
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres-notification:5432/notification_db
      DB_USERNAME: ${NOTIFICATION_DB_USER:-notification}
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification}
      FRONTEND_URL: http://crm.localhost

  api-gateway:
    image: ${REGISTRY:-mariimariis}/crm-api-gateway:${TAG:-latest}
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: pb-crm-api-gateway
    restart: unless-stopped
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      TEAM_SERVICE_URL: http://team-service:8082
      ACCOUNTS_SERVICE_URL: http://accounts-service:8083
      CATALOG_SERVICE_URL: http://catalog-service:8084
      SALES_SERVICE_URL: http://sales-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8081
      ALLOWED_ORIGINS: http://crm.localhost,http://localhost

  frontend:
    image: ${REGISTRY:-mariimariis}/crm-frontend:${TAG:-latest}
    build:
      context: frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: pb-crm-frontend
    restart: unless-stopped

  edge:
    image: nginx:1.27-alpine
    container_name: pb-crm-edge
    restart: unless-stopped
    depends_on:
      - frontend
      - api-gateway
      - grafana
    volumes:
      - ./docker/edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

  seeder:
    image: ${REGISTRY:-mariimariis}/crm-seeder:${TAG:-latest}
    build:
      context: .
      dockerfile: crm-seeder/Dockerfile
    container_name: pb-crm-seeder
    restart: "no"
    depends_on:
      api-gateway:
        condition: service_healthy
      team-service:
        condition: service_healthy
      accounts-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      sales-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    environment:
      GATEWAY_URL: http://api-gateway:8080

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: pb-crm-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      DEPLOYMENT_ENVIRONMENT: docker
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
      - loki
      - prometheus

  tempo:
    image: grafana/tempo:2.10.8
    container_name: pb-crm-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./observability/tempo/config.yaml:/etc/tempo/config.yaml:ro

  loki:
    image: grafana/loki:3.7.8
    container_name: pb-crm-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: pb-crm-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.2.2
    container_name: pb-crm-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: http://grafana.crm.localhost
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/nexo-crm-overview.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  loki-data:
  prometheus-data:
  grafana-data:
