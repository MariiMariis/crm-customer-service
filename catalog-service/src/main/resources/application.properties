spring.application.name=catalog-service
server.port=8084

spring.config.import=optional:configserver:http://localhost:8888
spring.cloud.config.request-connect-timeout=1500
spring.cloud.config.request-read-timeout=3000

spring.datasource.url=jdbc:postgresql://localhost:5434/catalog_db
spring.datasource.username=catalog
spring.datasource.password=catalog

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.revision_field_name=rev
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=revtype
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
info.app.name=${spring.application.name}
info.app.description=Catalogo de produtos do CRM
info.app.version=0.4.0

platform.config-source=local-file
