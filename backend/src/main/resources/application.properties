# === Aplicacao ===
spring.application.name=crm-customer-service
server.port=8080

# === Datasource H2 em memoria ===
spring.datasource.url=jdbc:h2:mem:crmdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 disponivel em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# === JPA / Hibernate ===
# create-drop: recria o schema a cada start (adequado para demo/estudo)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# === Carga inicial de dados (data.sql) ===
spring.sql.init.mode=always

# === CORS - front-end Next.js roda em localhost:3000 ===
app.cors.allowed-origins=http://localhost:3000
