spring.application.name=sales-service
server.port=8085
server.shutdown=graceful

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.request-connect-timeout=1500
spring.cloud.config.request-read-timeout=3000

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/sales_db}
spring.datasource.username=${DB_USERNAME:sales}
spring.datasource.password=${DB_PASSWORD:sales}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:crm}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:crm}
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=4
spring.rabbitmq.listener.simple.prefetch=10

crm.messaging.exchange=sales.events
crm.messaging.outbox.poll-interval=500ms
crm.messaging.outbox.batch-size=50
crm.messaging.retry.delays=5s,30s,2m

crm.sales.conversion-timeout=15m
crm.sales.conversion-timeout-check=60s

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.revision_field_name=rev
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=revtype
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
info.app.name=${spring.application.name}
info.app.description=Leads, oportunidades e atividades do CRM
info.app.version=1.0.0

platform.config-source=local-file

logging.pattern.correlation=[%X{trace_id:-},%X{span_id:-}] 
