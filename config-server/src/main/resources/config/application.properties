platform.name=PB CRM Platform
platform.environment=local
platform.config-source=config-server

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=crm
spring.rabbitmq.password=crm

crm.messaging.outbox.poll-interval=500ms
crm.messaging.outbox.batch-size=50
crm.messaging.retry.delays=5s,30s,2m
