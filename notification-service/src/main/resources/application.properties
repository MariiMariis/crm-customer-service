spring.application.name=notification-service
server.port=8081

spring.config.import=optional:configserver:http://localhost:8888
spring.cloud.config.request-connect-timeout=1500
spring.cloud.config.request-read-timeout=3000

spring.datasource.url=jdbc:postgresql://localhost:5436/notification_db
spring.datasource.username=notification
spring.datasource.password=notification

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=crm
spring.rabbitmq.password=crm
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=4
spring.rabbitmq.listener.simple.prefetch=10

crm.messaging.exchange=notification.events
crm.messaging.outbox.poll-interval=500ms
crm.messaging.outbox.batch-size=50
crm.messaging.retry.delays=5s,30s,2m

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.revision_field_name=rev
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=revtype
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
info.app.name=${spring.application.name}
info.app.description=Alertas comerciais do CRM
info.app.version=0.4.0

platform.config-source=local-file

crm.notification.dispatch.concurrency=2
crm.notification.dispatch.max-concurrency=6
crm.notification.sender-name=PB CRM
crm.notification.sender-email=no-reply@pbtech.com.br
crm.notification.frontend-url=http://localhost:3000
